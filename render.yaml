# Déploiement sur Render (Blueprint) : l'API Express sert aussi le front compilé
services:
  - type: web
    name: todolist
    runtime: node
    plan: free
    # --include=dev : TypeScript, Vite et le CLI Prisma sont nécessaires pour compiler
    buildCommand: npm ci --include=dev && npm run build
    # Applique les migrations Prisma puis démarre le serveur
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Adresse de connexion de la base Neon, à coller dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
